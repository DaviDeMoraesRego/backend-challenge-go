# Ambiente local completo do desafio: PostgreSQL, LocalStack (SQS) e Keycloak, mais
# os one-shot de migrations. Nenhuma peça de infra é mockada — os testes de
# integração usam estes containers reais.
#
# `name:` fixa o projeto Compose (rede/volume estáveis entre máquinas).
# `depends_on` com `condition: service_healthy` só destrava quando o serviço está
# PRONTO (o `depends_on` simples só espera o container iniciar).

name: wager-backend

services:
  # PostgreSQL: persistência transacional. Constraints e locks (§5) são impostos
  # aqui, não na aplicação.
  postgres:
    image: postgres:16-alpine
    container_name: wager-postgres
    environment:
      # Credenciais locais de exemplo (em produção viriam de secrets).
      POSTGRES_USER: ${POSTGRES_USER:-wager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wager}
      POSTGRES_DB: ${POSTGRES_DB:-wager}
      # Collation estável: o hash de idempotência (§9) precisa ser determinístico.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 5432 no host para psql/testcontainers.
      - "5432:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a `compose down` (sem `-v`).
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready retorna 0 só quando o servidor aceita conexões — é o que
      # destrava o `depends_on: service_healthy` do migrate.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wager} -d ${POSTGRES_DB:-wager}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # LocalStack: broker SQS emulado. As filas FIFO e as DLQs são provisionadas pelo
  # script em /etc/localstack/init/ready.d (roda quando o LocalStack fica pronto).
  localstack:
    image: localstack/localstack:3.8
    container_name: wager-localstack
    environment:
      # Só SQS: serviços não usados desperdiçam memória e atrasam o boot.
      SERVICES: sqs
      DEBUG: "0"
      # Região precisa casar com o SDK Go, senão a assinatura SigV4 é rejeitada.
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "4566:4566"
    volumes:
      # `ready.d`: scripts rodam UMA vez, quando o LocalStack está pronto.
      - ./deploy/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Keycloak: IdP OAuth2/OIDC. `--import-realm` lê os realms de
  # /opt/keycloak/data/import no boot (idempotente para um realm já existente).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: wager-keycloak
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      # `KC_HOSTNAME` fixa o `iss` do token em http://localhost:8080/realms/wager —
      # o endereço que o CLIENTE usa. Por isso a app tem DUAS variáveis:
      # KEYCLOAK_ISSUER (valida o `iss`) e KEYCLOAK_JWKS_URL (busca as chaves por
      # dentro da rede do Compose). Derivar uma da outra causaria issuer mismatch.
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "8080:8080"   # OIDC público (issuer/authorize/token/jwks)
      - "9000:9000"   # management port: /health/ready e /health/live
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # A imagem não garante `curl`; testamos o /dev/tcp do management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Migrations: one-shot que aplica o schema versionado antes de a app conectar.
  migrate:
    image: migrate/migrate:v4.18.1
    container_name: wager-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-wager}:${POSTGRES_PASSWORD:-wager}@postgres:5432/${POSTGRES_DB:-wager}?sslmode=disable"
      - "up"
    restart: "no"

  # API HTTP. Sem `container_name` de propósito: permite `--scale api=2` (§8).
  api:
    build:
      context: .
      args:
        TARGET: api
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Só sobe depois de o schema existir (o migrate sai com 0).
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-wager}:${POSTGRES_PASSWORD:-wager}@postgres:5432/${POSTGRES_DB:-wager}?sslmode=disable
      # Emissor (valida o `iss`) e JWKS (endpoint interno) são coisas diferentes.
      KEYCLOAK_ISSUER: http://localhost:8080/realms/wager
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/wager/protocol/openid-connect/certs
      SQS_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localstack:4566
      # Credenciais de TESTE do LocalStack (o valor é irrelevante, mas precisa existir).
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: 20s
      # Métricas em porta separada da API (§12).
      METRICS_ADDR: ":9090"
    ports:
      # 8081 no host porque 8080 já é o Keycloak.
      - "8081:8080"
      - "9090:9090"

  # Worker: consumidor SQS + relay do outbox + worker de referências.
  # `replicas: 3` atende ao §8 ("três processos independentes"): cada réplica abre
  # seu próprio pool e memória; a coordenação é por lock de linha no banco.
  worker:
    build:
      context: .
      args:
        TARGET: worker
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 3
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wager}:${POSTGRES_PASSWORD:-wager}@postgres:5432/${POSTGRES_DB:-wager}?sslmode=disable
      KEYCLOAK_ISSUER: http://localhost:8080/realms/wager
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/wager/protocol/openid-connect/certs
      SQS_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      SQS_CONSUMER_NAME: wager-transactions-worker
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # O prazo de encerramento precisa ser compatível com o visibility timeout.
      SHUTDOWN_TIMEOUT: 25s
      METRICS_ADDR: ":9090"

volumes:
  postgres-data:
  localstack-data:
